[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "isles2022"
version = "0.1.0"
description = "Reusable components for the ISLES 2022 stroke segmentation notebook"
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "torch", "monai"]

[project.optional-dependencies]
test = ["nibabel", "setuptools>=61", "wheel"]

[tool.setuptools.packages.find]
include = ["isles2022*", "evaluation*"]

[tool.setuptools.package-data]
evaluation = ["USAGE.md"]
